name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "ETToolbox-${VERSION}.apk"
          gh release create "$VERSION" \
            --title "ET Toolbox ${VERSION#v}" \
            --generate-notes --verify-tag \
            "ETToolbox-${VERSION}.apk" \
            || gh release upload "$VERSION" --clobber "ETToolbox-${VERSION}.apk"
