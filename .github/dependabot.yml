version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "chore(deps)"
    groups:
      android-dependencies:
        patterns:
          - "androidx.*"
          - "com.google.android.material*"
      kotlin-dependencies:
        patterns:
          - "org.jetbrains.kotlin*"
      gradle-plugins:
        patterns:
          - "com.android*"
          - "org.jetbrains.kotlin.android"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"